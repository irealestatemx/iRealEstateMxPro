<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iRealEstateMxPro — Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #04080f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Orbs de fondo */
    .orb {
      pointer-events: none;
      position: absolute;
      border-radius: 50%;
    }
    .orb-1 {
      top: -120px; left: -120px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(196,154,60,.18) 0%, transparent 70%);
      animation: float 6s ease-in-out infinite;
    }
    .orb-2 {
      bottom: -100px; right: -80px;
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(196,154,60,.12) 0%, transparent 70%);
      animation: float 8s ease-in-out infinite reverse;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Card principal */
    .login-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 16px;
      padding: 48px 40px;
      background: rgba(13, 22, 38, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(196,154,60,.2);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(196,154,60,.06);
      text-align: center;
    }

    .login-logo {
      height: 56px;
      margin-bottom: 28px;
      filter: drop-shadow(0 0 16px rgba(196,154,60,.4));
    }

    .login-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: #c49a3c;
      margin-bottom: 4px;
      letter-spacing: -.02em;
    }
    .login-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,.4);
      margin-bottom: 32px;
    }

    /* Error */
    .error-msg {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(127,29,29,.4);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: left;
    }

    /* Campos */
    .field { text-align: left; margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,.45);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(13,22,38,.8);
      border: 1px solid rgba(196,154,60,.22);
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: rgba(255,255,255,.9);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input::placeholder { color: rgba(255,255,255,.2); }
    .field input:focus {
      border-color: #c49a3c;
      box-shadow: 0 0 0 3px rgba(196,154,60,.15);
    }
    .field input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px #0d1626 inset;
      -webkit-text-fill-color: rgba(255,255,255,.9);
    }

    /* Botón */
    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      background: linear-gradient(135deg, #9a7220 0%, #c49a3c 50%, #e2b95a 100%);
      color: #07101d;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(196,154,60,.35);
      transition: filter .2s, transform .2s, box-shadow .2s;
    }
    .btn-login:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(196,154,60,.45);
    }
    .btn-login:active { transform: translateY(0); filter: brightness(.96); }

    /* Links */
    .link-forgot {
      display: inline-block;
      margin-top: 18px;
      font-size: 13px;
      color: rgba(196,154,60,.75);
      text-decoration: none;
      font-weight: 500;
      transition: color .2s;
    }
    .link-forgot:hover { color: #c49a3c; }

    .login-footer {
      margin-top: 28px;
      font-size: 11px;
      color: rgba(255,255,255,.18);
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-card">
    <img src="/static/img/logo-header.png" alt="iRealEstateMx" class="login-logo" />
    <h1 class="login-title">Bienvenido</h1>
    <p class="login-subtitle">Accede a tu panel profesional</p>

    {% if error %}
    <div class="error-msg">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20" style="flex-shrink:0"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>

    <a href="/forgot-password" class="link-forgot">¿Olvidaste tu contraseña?</a>
    <p class="login-footer">iRealEstateMxPro &copy; 2026</p>
  </div>
</body>
</html>

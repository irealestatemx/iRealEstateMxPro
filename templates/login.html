<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iRealEstateMxPro — Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: { 950: '#04080f', 900: '#07101d', 800: '#0d1626', 700: '#111d30', 600: '#182437' },
            gold: { DEFAULT: '#c49a3c', light: '#e2b95a', dim: '#9a7220' }
          },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'], serif: ['"Playfair Display"','serif'] }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes glow { 0%,100%{opacity:.4} 50%{opacity:.8} }
    .orb { animation: float 6s ease-in-out infinite, glow 4s ease-in-out infinite; }
    .orb2 { animation: float 8s ease-in-out infinite reverse, glow 5s ease-in-out infinite; }
    .glass-card {
      background: rgba(13,22,38,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(196,154,60,0.18);
    }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px #0d1626 inset;
      -webkit-text-fill-color: #f0f4f8;
    }
  </style>
</head>
<body class="bg-navy-950 min-h-screen flex items-center justify-center overflow-hidden relative">

  <!-- Ambient orbs -->
  <div class="orb pointer-events-none absolute top-[-120px] left-[-120px] w-[400px] h-[400px] rounded-full"
       style="background:radial-gradient(circle,rgba(196,154,60,.18) 0%,transparent 70%)"></div>
  <div class="orb2 pointer-events-none absolute bottom-[-100px] right-[-80px] w-[320px] h-[320px] rounded-full"
       style="background:radial-gradient(circle,rgba(196,154,60,.12) 0%,transparent 70%)"></div>

  <!-- Grid texture -->
  <div class="pointer-events-none absolute inset-0"
       style="background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;"></div>

  <div class="glass-card relative w-full max-w-[420px] mx-4 rounded-2xl px-10 py-12 shadow-2xl">

    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <img src="/static/img/logo-header.png" alt="iRealEstateMx"
           class="h-14 drop-shadow-[0_0_16px_rgba(196,154,60,0.4)]" />
    </div>

    <h1 class="text-center font-serif text-2xl font-bold text-gold mb-1">Bienvenido</h1>
    <p class="text-center text-sm text-white/40 mb-8">Accede a tu panel profesional</p>

    {% if error %}
    <div class="flex items-center gap-3 bg-red-950/50 border border-red-500/30 text-red-400 rounded-xl px-4 py-3 mb-6 text-sm">
      <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-5">
      <div>
        <label for="email" class="block text-xs font-semibold text-white/50 mb-2 uppercase tracking-wider">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required
               class="w-full px-4 py-3 bg-navy-800/80 border border-gold/20 rounded-xl text-[15px] text-white/90 placeholder-white/20 outline-none transition-all duration-200 focus:border-gold focus:ring-2 focus:ring-gold/20" />
      </div>
      <div>
        <label for="password" class="block text-xs font-semibold text-white/50 mb-2 uppercase tracking-wider">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required
               class="w-full px-4 py-3 bg-navy-800/80 border border-gold/20 rounded-xl text-[15px] text-white/90 placeholder-white/20 outline-none transition-all duration-200 focus:border-gold focus:ring-2 focus:ring-gold/20" />
      </div>

      <button type="submit"
              class="w-full py-3.5 rounded-xl font-bold text-navy-950 text-[15px] transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0 mt-2"
              style="background:linear-gradient(135deg,#9a7220 0%,#c49a3c 50%,#e2b95a 100%);box-shadow:0 4px 20px rgba(196,154,60,.35);">
        Iniciar Sesión
      </button>
    </form>

    <div class="text-center mt-5">
      <a href="/forgot-password"
         class="text-[13px] text-gold/80 hover:text-gold transition-colors font-medium">
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <p class="text-center text-[11px] text-white/20 mt-8">iRealEstateMxPro &copy; 2026</p>
  </div>
</body>
</html>

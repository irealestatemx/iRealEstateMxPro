<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iRealEstateMxPro — Recuperar Contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #04080f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .orb {
      pointer-events: none;
      position: absolute;
      border-radius: 50%;
    }
    .orb-1 {
      top: -100px; right: -80px;
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(196,154,60,.14) 0%, transparent 70%);
      animation: float 7s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .auth-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 16px;
      padding: 48px 40px;
      background: rgba(13, 22, 38, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(196,154,60,.2);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,.6);
      text-align: center;
    }
    .auth-logo {
      height: 56px;
      margin-bottom: 28px;
      filter: drop-shadow(0 0 16px rgba(196,154,60,.4));
    }
    .auth-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: #c49a3c;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,.4);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .error-msg {
      display: flex; align-items: center; gap: 10px;
      background: rgba(127,29,29,.4); border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5; padding: 11px 14px; border-radius: 12px;
      font-size: 13px; margin-bottom: 20px; text-align: left;
    }
    .success-msg {
      display: flex; align-items: flex-start; gap: 10px;
      background: rgba(6,78,59,.4); border: 1px solid rgba(52,211,153,.3);
      color: #6ee7b7; padding: 14px; border-radius: 12px;
      font-size: 13px; margin-bottom: 20px; text-align: left; line-height: 1.6;
    }
    .field { text-align: left; margin-bottom: 18px; }
    .field label {
      display: block; font-size: 10px; font-weight: 700;
      color: rgba(255,255,255,.45); text-transform: uppercase;
      letter-spacing: 1.2px; margin-bottom: 8px;
    }
    .field input {
      width: 100%; padding: 12px 16px;
      background: rgba(13,22,38,.8);
      border: 1px solid rgba(196,154,60,.22);
      border-radius: 12px; font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: rgba(255,255,255,.9); outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input::placeholder { color: rgba(255,255,255,.2); }
    .field input:focus {
      border-color: #c49a3c;
      box-shadow: 0 0 0 3px rgba(196,154,60,.15);
    }
    .btn-primary {
      width: 100%; padding: 14px; margin-top: 6px;
      background: linear-gradient(135deg, #9a7220 0%, #c49a3c 50%, #e2b95a 100%);
      color: #07101d; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; font-family: 'Inter', sans-serif;
      cursor: pointer; box-shadow: 0 4px 20px rgba(196,154,60,.35);
      transition: filter .2s, transform .2s, box-shadow .2s;
      text-decoration: none; display: inline-block;
    }
    .btn-primary:hover {
      filter: brightness(1.08); transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(196,154,60,.45);
    }
    .btn-primary:active { transform: translateY(0); }
    .link-back {
      display: inline-block; margin-top: 18px;
      font-size: 13px; color: rgba(196,154,60,.7);
      text-decoration: none; font-weight: 500;
      transition: color .2s;
    }
    .link-back:hover { color: #c49a3c; }
    .auth-footer { margin-top: 28px; font-size: 11px; color: rgba(255,255,255,.18); }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>

  <div class="auth-card">
    <img src="/static/img/logo-header.png" alt="iRealEstateMx" class="auth-logo" />
    <h1 class="auth-title">Recuperar contraseña</h1>
    <p class="auth-subtitle">Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña</p>

    {% if error %}
    <div class="error-msg">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20" style="flex-shrink:0"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      {{ error }}
    </div>
    {% endif %}

    {% if message %}
    <div class="success-msg">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20" style="flex-shrink:0;margin-top:2px"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
      {{ message }}
    </div>
    {% else %}
    <form method="post" action="/forgot-password">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required />
      </div>
      <button type="submit" class="btn-primary">Enviar enlace de recuperación</button>
    </form>
    {% endif %}

    <a href="/login" class="link-back">← Volver a iniciar sesión</a>
    <p class="auth-footer">iRealEstateMxPro &copy; 2026</p>
  </div>
</body>
</html>
